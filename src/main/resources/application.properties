spring.application.name=erp-backend

# Local defaults are used only when the environment variable is not set. On Render (or any server) set
# DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD - they win over these defaults.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Nebil@2026}

# Small pool: Neon (and Render's free tier) have limited connections, and idle ones are released so the
# database can go to sleep when nobody is using the app.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# Render tells the app which port to listen on through PORT.
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

erp.jwt.secret=${JWT_SECRET:change-this-in-every-environment-to-a-long-random-secret}
erp.jwt.access-token-minutes=60
erp.jwt.refresh-token-days=7

erp.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
