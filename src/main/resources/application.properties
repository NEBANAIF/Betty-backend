spring.application.name=erp-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/erp
spring.datasource.username=postgres
spring.datasource.password=Nebil@2026

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

erp.jwt.secret=${JWT_SECRET:change-this-in-every-environment-to-a-long-random-secret}
erp.jwt.access-token-minutes=60
erp.jwt.refresh-token-days=7

erp.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
