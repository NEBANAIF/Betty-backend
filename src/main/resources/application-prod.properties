spring.jpa.show-sql=false

logging.level.com.company.erp=INFO
logging.level.org.springframework.security=WARN

erp.seed.enabled=false

# ---- Fast start on small hosts (Render free tier gives ~0.1 CPU) ----
# Render gives up if nothing listens on the port within ~90 seconds. Without these the app took ~97 s to open
# the port (Hibernate + every bean built before Tomcat starts), so deploys timed out although the app was fine.
# Lazy beans: Tomcat opens the port first, services/controllers are built on first use.
spring.main.lazy-initialization=true
# Flyway owns the schema, so skip Hibernate's boot-time schema check and its JDBC metadata probe
# (each one is a round trip to the remote Neon database).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# In production these MUST be supplied via environment variables, never
# committed: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET,
# CORS_ORIGINS.
